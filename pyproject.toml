[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelscan"
dynamic = ["version"]
description = "Passive website security scanner (headers, TLS, cookies, CORS) with platform-specific fixes. Also a Claude skill."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kelvin Sitorus" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["security", "scanner", "security-headers", "tls", "owasp", "claude-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Environment :: Console",
]

[project.scripts]
sentinelscan = "sentinelscan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sentinelscan.__version__" }

[tool.setuptools.packages.find]
include = ["sentinelscan*"]
